<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<section layout:fragment="content">
    <h1>Đăng nhập</h1>
    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <strong>Lỗi!</strong> Tên đăng nhập hoặc mật khẩu không chính xác.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            <strong>Thành công!</strong> Bạn đã đăng xuất.
        </div>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Nhập tên đăng nhập" required>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Nhập mật khẩu" required>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" name="remember-me" id="remember-me">
            <label class="form-check-label" for="remember-me">Ghi nhớ tôi</label>
        </div>

        <div class="form-action">
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
            <p>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
        </div>
    </form>
</section>
</body>
</html>
