<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{auth-layout}">
<head>
    <title>Đăng ký</title>
</head>
<body>
<section layout:fragment="content">
    <h1>Đăng ký</h1>

    <!-- Display single error if any -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <strong>Lỗi!</strong> <span th:text="${error}"></span>
    </div>

    <!-- Display validation errors -->
    <div th:if="${errors}" class="alert alert-danger" role="alert">
        <strong>Lỗi xác thực:</strong>
        <ul>
            <li th:each="error : ${errors}" th:text="${error}"></li>
        </ul>
    </div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="Nhập email của bạn" required>
        </div>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Nhập tên đăng nhập" required>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" class="form-control" id="password"
                   name="password" placeholder="Nhập mật khẩu" required>
        </div>
        <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   placeholder="Nhập số điện thoại" required>
        </div>
        <div class="form-action">
            <button type="submit" class="btn btn-primary">Đăng ký</button>
            <p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a></p>
        </div>
    </form>

    <script>
        console.log("Register page loaded");
    </script>
</section>
</body>
</html>
