name: Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: thanhhai3009
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build Docker image
        run: |
          docker build -t thanhhai3009/tranthanhhai-app:latest .
          docker build -t thanhhai3009/tranthanhhai-app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push thanhhai3009/tranthanhhai-app:latest
          docker push thanhhai3009/tranthanhhai-app:${{ github.sha }}
      
      - name: Triển khai lên DevOps Classroom
        run: |
          REPO="thanhhai3009/tranthanhhai-app"
          CONTAINER_PORT=80
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}?repo=$REPO&tag=latest&slot=8&container_port=$CONTAINER_PORT&strict_container_port=0")
          BODY=$(echo "$RESPONSE" | sed "$d")
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "Webhook HTTP: $CODE"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Deploy thất bại. Xem chi tiết trong nhóm log bên dưới."
            echo "::group::Chi tiết webhook JSON"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            echo "::endgroup::"
            exit 1
          fi
          echo "Deploy thành công."
          echo "::group::Chi tiết webhook JSON"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo "::endgroup::"
