name: Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: thanhhai3009
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build Docker image
        run: |
          docker build -t thanhhai3009/tranthanhhai-app:latest .
          docker build -t thanhhai3009/tranthanhhai-app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push thanhhai3009/tranthanhhai-app:latest
          docker push thanhhai3009/tranthanhhai-app:${{ github.sha }}
