services:
  db:
    image: mysql:8.4
    container_name: tranthanhhai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: webbanhang
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  app:
    image: thanhhai3009/tranthanhhai-app:latest
    container_name: tranthanhhai-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/webbanhang
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:8080/order/momo-return}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:8080/order/momo-return}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - app_net

  adminer:
    image: adminer:4
    container_name: tranthanhhai-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - app_net

volumes:
  mysql_data:
  maven_repo:

networks:
  app_net:
    driver: bridge

